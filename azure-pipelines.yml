trigger:
  branches:
    include:
    - main

variables:
  azureSubscription: '#############' # Replace with Azure Subscription ID or Name
  webAppName: 'grcportal'
  environmentName: 'grcportal'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        echo "Waiting for dpkg lock to be released..."
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Lock held by another process. Waiting..."
          sleep 5
        done

        sudo apt-get update
        sudo apt-get install -y build-essential libvips-dev
      displayName: 'Install build tools'

    - script: |
        npm cache clean --force
      displayName: 'Clean npm cache'

    - script: |
        retry() {
          for i in {1..5}; do "$@" && break || sleep 15; done
        }

        retry npm install --legacy-peer-deps
        npm run build
      displayName: 'Retry npm install and build'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      artifact: drop

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'grcportal-serviceconnection' # Replace with the correct service connection name
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'NODE|22-lts'
